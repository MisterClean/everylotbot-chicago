[package]
name = "everylotbot-chicago"
version = "2.0.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-3.0-only"

[[bin]]
name = "everylotbot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
dotenvy = "0.15"
hmac = "0.12"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
