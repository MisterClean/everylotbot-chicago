name: Roll back production
on:
  workflow_dispatch:
    inputs:
      target:
        description: Full commit SHA of a previously published native release
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: everylotbot-production
  cancel-in-progress: false
jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Promote an existing immutable native release (code only)
        run: |
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]
          gh release download "app-$TARGET" --pattern production.json --pattern everylotbot-linux-x86_64
          jq -e --arg commit "$TARGET" '.schema == 1 and .platform == "linux-x86_64" and .commit == $commit and (.sha256 | test("^[0-9a-f]{64}$"))' production.json
          printf '%s  %s\n' "$(jq -r .sha256 production.json)" everylotbot-linux-x86_64 | sha256sum -c
          gh release upload production production.json --clobber
