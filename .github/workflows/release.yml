name: Release
on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]
permissions:
  contents: write
  actions: read
  attestations: write
  id-token: write
concurrency:
  group: everylotbot-production
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the exact tested main artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-native
          path: native
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify artifact identity
        run: |
          jq -e --arg commit "$COMMIT" '.schema == 1 and .platform == "linux-x86_64" and .commit == $commit and (.sha256 | test("^[0-9a-f]{64}$"))' native/production.json
          printf '%s  %s\n' "$(jq -r .sha256 native/production.json)" native/everylotbot-linux-x86_64 | sha256sum -c
      - name: Attest native executable provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: native/everylotbot-linux-x86_64
      - name: Publish immutable release and promote latest main
        run: |
          tag="app-$COMMIT"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$tag" --dir existing --pattern production.json --pattern everylotbot-linux-x86_64
            cmp native/production.json existing/production.json
            cmp native/everylotbot-linux-x86_64 existing/everylotbot-linux-x86_64
          else
            gh release create "$tag" native/* --target "$COMMIT" --title "EveryLot $COMMIT" --notes 'Tested native Linux executable. Deployment preserves production state.' --latest=false
          fi
          if [[ $(gh api "repos/$GH_REPO/commits/main" --jq .sha) != "$COMMIT" ]]; then
            echo 'A newer main commit exists; skipping stale promotion.'
            exit 0
          fi
          if ! gh release view production >/dev/null 2>&1; then
            gh release create production --target "$COMMIT" --title 'Production pointer' --notes 'Automatically promoted after main CI. Lightsail polls this manifest.' --latest=false
          fi
          gh release upload production native/production.json --clobber
