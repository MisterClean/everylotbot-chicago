name: CI
on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Rust
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Formatting and lint
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          bash -n deploy/deploy-everylotbot deploy/run-everylotbot deploy/petit-bots-status scripts/native-smoke.sh
          shellcheck deploy/deploy-everylotbot deploy/run-everylotbot deploy/petit-bots-status scripts/native-smoke.sh
      - name: Test
        run: cargo test --locked
      - name: Build and smoke-test native executable
        run: |
          cargo build --release --locked
          bash scripts/native-smoke.sh
          python3 -m unittest discover -s tests -v
          mkdir -p dist/native
          cp target/release/everylotbot dist/native/everylotbot-linux-x86_64
          digest=$(sha256sum dist/native/everylotbot-linux-x86_64 | cut -d' ' -f1)
          jq -n --arg commit "$GITHUB_SHA" --arg sha256 "$digest" \
            '{schema:1,platform:"linux-x86_64",commit:$commit,sha256:$sha256}' > dist/native/production.json
      - name: Upload the exact tested executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-native
          path: dist/native/*
          if-no-files-found: error
          retention-days: 14
