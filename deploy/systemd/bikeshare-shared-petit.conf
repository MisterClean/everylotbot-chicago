# Keep the bikeshare deployer's service/health contract, but never start a
# second scheduler when that deployer installs a new base unit and restarts it.
[Unit]
Description=Bikeshare compatibility unit for the shared Petit scheduler
Requires=petit-bots.service
BindsTo=petit-bots.service
After=petit-bots.service

[Service]
Type=oneshot
RemainAfterExit=yes
ExecStartPre=
ExecStart=
ExecStart=/usr/bin/true
Restart=no
